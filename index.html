<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="生活OS">
<link rel="manifest" href="./manifest.webmanifest">
<title>大学生生活OS</title>
<style>
:root{--p:#6d5dfb;--p2:#8c7df8;--bg:#f5f6fa;--text:#202532;--muted:#7a8190;--line:#e9eaf0;--card:#fff;--danger:#e5484d;--ok:#19a974;--warn:#d98b00}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:92px}
header{padding:24px 20px 20px;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));border-radius:0 0 28px 28px;box-shadow:0 8px 25px #6d5dfb25}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:850;letter-spacing:-.03em}.sub{font-size:12px;opacity:.86;margin-top:4px}.date{margin-top:18px;font-size:13px;opacity:.9}.hero{margin-top:8px;font-size:20px;font-weight:800}.hero span{opacity:.9}
main{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border-radius:18px;padding:15px;box-shadow:0 2px 10px #20253208}.label{font-size:11px;color:var(--muted)}.value{font-size:21px;font-weight:850;margin-top:5px}.value.small{font-size:18px}.section{margin-top:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h2{font-size:17px;margin:0}button{font:inherit;touch-action:manipulation;cursor:pointer;border:0;border-radius:12px;padding:9px 13px;background:var(--p);color:white;font-weight:750}.ghost{background:#eeecff;color:#5b4bd6}.danger{color:var(--danger)}.item{background:var(--card);padding:14px;border-radius:15px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 2px 10px #20253208}.item-main{min-width:0}.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.pill{padding:5px 9px;border-radius:99px;background:#eeeaff;color:#5b4bd6;font-size:10px;white-space:nowrap;font-weight:750}.pill.ok{background:#e7f8f0;color:var(--ok)}.pill.warn{background:#fff4dc;color:var(--warn)}.pill.danger{background:#ffe8e9;color:var(--danger)}.empty{background:var(--card);border-radius:15px;color:#8a91a0;font-size:13px;padding:18px;text-align:center}.progress{height:7px;background:#eeeef4;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:99px}.barline{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:7px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#ffffffee;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:5}nav button{background:transparent;color:#858b99;padding:5px 2px;font-size:10px}nav button .ico{font-size:19px;line-height:19px}nav button.active{color:var(--p)}
.modal{display:none;position:fixed;inset:0;background:#0006;z-index:10;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:25px 25px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.grab{width:42px;height:4px;background:#ddd;border-radius:99px;margin:0 auto 15px}.field label{font-size:11px;color:var(--muted);display:block;margin-top:8px}.field input,.field select{width:100%;padding:13px;border:1px solid #dddfe7;border-radius:12px;margin:5px 0 10px;font-size:16px;background:#fff;color:var(--text)}.actions{display:flex;gap:8px;margin-top:8px}.actions button{flex:1}.cancel{background:#eceef3;color:#444}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;display:none;z-index:20;font-size:13px;box-shadow:0 6px 18px #0003}.fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:82px;width:52px;height:52px;border-radius:50%;font-size:25px;padding:0;box-shadow:0 8px 22px #6d5dfb55;z-index:4}.filterrow{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.filterrow button{white-space:nowrap;padding:7px 11px;font-size:11px;background:#fff;color:var(--muted);border:1px solid var(--line)}.filterrow button.on{background:#eeeaff;color:#5b4bd6;border-color:#ddd8ff}.statline{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:8px 0}.mini{font-size:11px;color:var(--muted)}

.profile-head{display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;overflow:hidden;flex:none;box-shadow:0 5px 15px #0002}.avatar img{width:100%;height:100%;object-fit:cover}.profile-name{font-size:15px;font-weight:850}.profile-meta{font-size:11px;opacity:.82;margin-top:3px}.iconbtn{width:40px;height:40px;padding:0;border-radius:50%;background:#ffffff24;border:1px solid #ffffff35;font-size:19px;display:grid;place-items:center}.profile-card{display:flex;align-items:center;gap:13px}.profile-card .avatar{width:58px;height:58px}.swatches{display:flex;gap:9px;flex-wrap:wrap;margin:7px 0 13px}.swatch{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ddd;cursor:pointer}.swatch.on{box-shadow:0 0 0 2px var(--p)}.colorrow{display:flex;gap:9px;align-items:center}.colorrow input[type=color]{width:48px;height:42px;border:0;padding:0;background:transparent}.toggle{display:flex;align-items:center;justify-content:space-between;background:#f7f7fa;padding:12px;border-radius:13px;margin:8px 0}.toggle input{width:22px;height:22px;accent-color:var(--p)}.settings-section{margin-top:18px}.favorite-image{position:relative;overflow:hidden;padding:0;height:190px;background:#eee;border-radius:18px}.favorite-image img{width:100%;height:100%;object-fit:cover;display:block}.favorite-image .overlay{position:absolute;inset:auto 0 0;padding:28px 14px 12px;color:#fff;background:linear-gradient(transparent,#0008)}.favorite-image .overlay b{font-size:14px}.image-actions{position:absolute;top:10px;right:10px;display:flex;gap:6px}.image-actions button{background:#0008;padding:7px 9px;font-size:11px}.settings-section h3{font-size:13px;margin:0 0 7px}.dangerbtn{background:#ffe8e9;color:#c83238}.smallbtn{padding:7px 10px;font-size:11px}
body.bg-image{background-size:cover;background-position:center;background-attachment:fixed}body.bg-image .app{background:rgba(245,246,250,.86);backdrop-filter:blur(3px)}
@media (min-width:521px){body{padding:12px 0}.app{border-radius:24px;overflow:hidden;box-shadow:0 10px 50px #20253212}}
</style>
</head>
<body>
<div class="app">
<header><div class="top"><div class="profile-head"><div class="avatar" id="headerAvatar">OS</div><div><div class="brand">大学生生活OS</div><div class="sub" id="headerSub">大学生活を、ちょっとラクに。</div></div></div><button class="iconbtn" id="profileBtn" type="button" aria-label="プロフィール設定">⚙️</button></div><div class="date" id="todayLabel"></div><div class="hero" id="heroText"></div></header>
<main id="screen"></main>
<nav id="nav"><button type="button" class="active" data-tab="home"><div class="ico">⌂</div>ホーム</button><button type="button" data-tab="tasks"><div class="ico">✓</div>課題</button><button type="button" data-tab="schedule"><div class="ico">◷</div>予定</button><button type="button" data-tab="money"><div class="ico">￥</div>お金</button></nav>
</div>
<button class="fab" id="fab" type="button">＋</button>
<div class="modal" id="modal"><div class="sheet"><div class="grab"></div><h2 id="modalTitle">追加</h2><div id="form"></div><div class="actions"><button type="button" class="cancel" id="cancelBtn">キャンセル</button><button type="button" id="saveBtn">追加する</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY="student_os_v2";
const initial={tasks:[],schedule:[],money:[],budget:50000,profile:{name:"",university:"",grade:"",bio:"",avatar:"",favoriteImage:"",accent:"#6d5dfb",accent2:"#8c7df8",bg:"#f5f6fa",bgImage:"",dark:false}};
let data=load(),tab="home",modalType="",taskFilter="all",moneyMonth="current";
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"null");return d&&d.tasks&&d.schedule&&d.money?{...initial,...d,profile:{...initial.profile,...(d.profile||{})}}:initial}catch(e){return initial}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function pad(n){return String(n).padStart(2,"0")}
function localDate(d=new Date()){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function monthKey(d){return d.slice(0,7)}
function currentMonth(){return localDate().slice(0,7)}
function yen(n){return new Intl.NumberFormat("ja-JP").format(Math.round(n))+"円"}
function esc(s){return String(s??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display="none",1600)}
function daysUntil(ds){const a=new Date(localDate()+"T00:00:00"),b=new Date(ds+"T00:00:00");return Math.round((b-a)/86400000)}
function dueText(ds){const n=daysUntil(ds);if(n<0)return `<span class="pill danger">${Math.abs(n)}日超過</span>`;if(n===0)return '<span class="pill danger">今日</span>';if(n===1)return '<span class="pill warn">明日</span>';return `<span class="pill">あと${n}日</span>`}
function applyProfile(){
 const pr=data.profile||initial.profile;
 document.documentElement.style.setProperty("--p",pr.accent||initial.profile.accent);
 document.documentElement.style.setProperty("--p2",pr.accent2||initial.profile.accent2);
 document.documentElement.style.setProperty("--bg",pr.bg||initial.profile.bg);
 document.querySelector('meta[name="theme-color"]').setAttribute("content",pr.accent||initial.profile.accent);
 document.body.classList.toggle("bg-image",!!pr.bgImage);
 document.body.style.backgroundImage=pr.bgImage?`url("${pr.bgImage}")`:"";
}
function profileAvatarHTML(){const pr=data.profile||initial.profile;if(pr.avatar)return `<img src="${pr.avatar}" alt="">`;const n=(pr.name||"OS").trim();return esc(n.slice(0,1).toUpperCase()||"OS")}
function profileView(){
 const pr=data.profile||initial.profile;
 const colors=["#6d5dfb","#0f766e","#2563eb","#db2777","#ea580c","#16a34a","#111827"];
 return `<div class="head"><div><h2>プロフィール・デザイン</h2><div class="mini">自分だけの生活OSにカスタマイズ</div></div><button class="ghost" data-action="back-home">← 戻る</button></div>
 <div class="card profile-card"><div class="avatar" id="profilePreview">${profileAvatarHTML()}</div><div style="min-width:0"><b>${esc(pr.name||"名前を設定しよう")}</b><small>${esc(pr.university||"大学名未設定")}${pr.grade?" ・ "+esc(pr.grade):""}</small></div><button class="ghost smallbtn" data-action="avatar">画像変更</button></div>
 <div class="card section"><div class="settings-section"><h3>プロフィール</h3><div class="field"><label>名前</label><input id="p-name" value="${esc(pr.name)}" placeholder="例：たろう"></div><div class="field"><label>大学・所属</label><input id="p-univ" value="${esc(pr.university)}" placeholder="例：○○大学 経済学部"></div><div class="field"><label>学年</label><select id="p-grade"><option value="">未設定</option><option ${pr.grade==="1年"?"selected":""}>1年</option><option ${pr.grade==="2年"?"selected":""}>2年</option><option ${pr.grade==="3年"?"selected":""}>3年</option><option ${pr.grade==="4年"?"selected":""}>4年</option><option ${pr.grade==="その他"?"selected":""}>その他</option></select></div><div class="field"><label>ひとこと</label><input id="p-bio" value="${esc(pr.bio)}" placeholder="例：今学期は単位を落とさない！"></div></div>
 <div class="settings-section"><h3>テーマカラー</h3><div class="swatches">${colors.map(c=>`<button type="button" class="swatch ${pr.accent===c?"on":""}" style="background:${c}" data-color="${c}" aria-label="テーマカラー"></button>`).join("")}</div><div class="colorrow"><span class="mini">好きな色</span><input id="p-accent" type="color" value="${pr.accent||initial.profile.accent}"><span class="mini" id="colorHex">${pr.accent||initial.profile.accent}</span></div></div>
 <div class="settings-section"><h3>お気に入り画像</h3><div class="mini" style="margin-bottom:8px">ホーム画面に好きな写真・イラストを飾れます</div><div class="favorite-image" style="height:130px">${pr.favoriteImage?`<img src="${pr.favoriteImage}" alt="お気に入り画像"><div class="overlay"><b>お気に入り画像</b></div>`:`<div style="height:100%;display:grid;place-items:center;color:#888;font-size:12px">まだ画像がありません</div>`}<div class="image-actions"><button type="button" data-action="favorite-image">${pr.favoriteImage?'変更':'画像を追加'}</button>${pr.favoriteImage?'<button type="button" class="dangerbtn" data-action="remove-favorite-image">削除</button>':''}</div></div></div>
 <div class="settings-section"><h3>背景</h3><div class="colorrow"><span class="mini">背景色</span><input id="p-bg" type="color" value="${pr.bg||initial.profile.bg}"><span class="mini">画像を設定すると背景色より優先されます</span></div><div class="actions"><button class="ghost" data-action="bg-image">背景画像を選ぶ</button><button class="dangerbtn" data-action="remove-bg">画像を削除</button></div></div>
 <div class="settings-section"><div class="toggle"><div><b>設定を保存</b><div class="mini">変更はこの端末に保存されます</div></div><button data-action="save-profile">保存する</button></div></div>
 <div class="settings-section"><button class="dangerbtn" style="width:100%" data-action="reset-profile">プロフィール・デザインを初期化</button></div></div>`;
}
function openProfile(){tab="profile";render()}
function saveProfile(){
 const pr=data.profile||initial.profile;
 pr.name=v("p-name");pr.university=v("p-univ");pr.grade=v("p-grade");pr.bio=v("p-bio");pr.accent=v("p-accent")||initial.profile.accent;pr.bg=v("p-bg")||initial.profile.bg;
 data.profile=pr;save();applyProfile();render();toast("プロフィールを保存しました");
}
function resetProfile(){if(!confirm("プロフィールとデザイン設定を初期化しますか？"))return;data.profile={...initial.profile};save();applyProfile();render();toast("初期設定に戻しました")}
function readImage(file,kind){if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=kind==="avatar"?480:1200;let w=img.width,h=img.height;if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);const dataUrl=c.toDataURL("image/jpeg",.82);if(kind==="avatar")data.profile.avatar=dataUrl;else if(kind==="favorite")data.profile.favoriteImage=dataUrl;else data.profile.bgImage=dataUrl;save();applyProfile();render();toast(kind==="avatar"?"アイコンを設定しました":kind==="favorite"?"お気に入り画像を設定しました":"背景画像を設定しました")};img.src=reader.result};reader.readAsDataURL(file)}
function chooseImage(kind){const input=document.createElement("input");input.type="file";input.accept="image/*";input.onchange=()=>readImage(input.files[0],kind);input.click()}
function render(){
 const now=new Date();document.getElementById("todayLabel").textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
 applyProfile(); const pr=data.profile||initial.profile; document.getElementById("headerAvatar").innerHTML=profileAvatarHTML(); document.getElementById("headerSub").textContent=pr.name?(pr.bio||`${pr.university||"大学生活"}を、ちょっとラクに。`):"大学生活を、ちょっとラクに。"; const unfinished=data.tasks.filter(x=>x.done!=="完了").length;document.getElementById("heroText").innerHTML=unfinished?`未完了の課題が <span>${unfinished}件</span> あるよ`:`今日はいい感じ。やることは片付いてる！`;
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
 document.getElementById("fab").style.display=(tab==="home"||tab==="profile")?"none":"block";
 let html="";
 if(tab==="home") html=homeView(); else if(tab==="tasks") html=tasksView(); else if(tab==="schedule") html=scheduleView(); else if(tab==="money") html=moneyView(); else html=profileView();
 document.getElementById("screen").innerHTML=html;
}
function homeView(){
 const mk=currentMonth(), ms=data.money.filter(x=>x.date.slice(0,7)===mk),income=ms.filter(x=>x.type==="収入").reduce((a,x)=>a+x.amount,0),expense=ms.filter(x=>x.type==="支出").reduce((a,x)=>a+x.amount,0),remaining=data.budget-expense;
 const tasks=data.tasks.filter(x=>x.done!=="完了").sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3),today=localDate(),sch=data.schedule.filter(x=>x.date===today).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
 const pct=Math.min(100,Math.max(0,Math.round(expense/Math.max(1,data.budget)*100)));
 return `<div class="grid"><div class="card"><div class="label">今月の収入</div><div class="value">${yen(income)}</div></div><div class="card"><div class="label">今月の支出</div><div class="value">${yen(expense)}</div></div><div class="card"><div class="label">あと使えるお金</div><div class="value small">${yen(remaining)}</div></div><div class="card"><div class="label">未完了の課題</div><div class="value">${data.tasks.filter(x=>x.done!=="完了").length}件</div></div></div>
 <div class="card section"><div class="head"><h2>💰 今月の予算</h2><button class="ghost" data-action="budget">設定</button></div><div class="statline"><span>使用 ${yen(expense)}</span><b>${pct}%</b></div><div class="progress"><i style="width:${pct}%"></i></div><div class="barline"><span>予算 ${yen(data.budget)}</span><span>残り ${yen(Math.max(0,remaining))}</span></div></div>
 <div class="section"><div class="head"><h2>📌 近い締切</h2><button class="ghost" data-action="tasks">すべて見る</button></div>${tasks.length?tasks.map(taskItem).join(""):empty("未完了の課題はないよ！")}</div>
 <div class="section"><div class="head"><h2>🗓 今日の予定</h2><button class="ghost" data-action="add-schedule">＋追加</button></div>${sch.length?sch.map(scheduleItem).join(""):empty("今日の予定はまだありません")}</div>
 ${data.profile.favoriteImage?`<div class="section"><div class="head"><h2>🖼️ お気に入り</h2><button class="ghost" data-action="favorite-image">変更</button></div><div class="favorite-image"><img src="${data.profile.favoriteImage}" alt="お気に入り画像"><div class="overlay"><b>${esc(data.profile.name||"My Life")}</b><div style="font-size:11px;opacity:.85;margin-top:2px">好きな画像を飾って、自分だけのホームに。</div></div><div class="image-actions"><button type="button" class="dangerbtn" data-action="remove-favorite-image">削除</button></div></div></div>`:""}`;
}
function tasksView(){let arr=data.tasks.slice().sort((a,b)=>a.date.localeCompare(b.date));if(taskFilter==="open")arr=arr.filter(x=>x.done!=="完了");if(taskFilter==="done")arr=arr.filter(x=>x.done==="完了");return `<div class="head"><div><h2>課題管理</h2><div class="mini">締切を入れるだけで残り日数を自動表示</div></div><button data-action="add-task">＋課題</button></div><div class="filterrow"><button class="${taskFilter==="all"?"on":""}" data-filter="all">すべて</button><button class="${taskFilter==="open"?"on":""}" data-filter="open">未完了</button><button class="${taskFilter==="done"?"on":""}" data-filter="done">完了</button></div>${arr.length?arr.map(taskItem).join(""):empty("該当する課題はありません")}`}
function taskItem(x){return `<div class="item" data-task-id="${x.id}"><div class="item-main"><b>${esc(x.name)}</b><small>${esc(x.subject||"科目未設定")} ・ ${x.date}</small></div>${x.done==="完了"?'<span class="pill ok">完了</span>':dueText(x.date)}</div>`}
function scheduleView(){let arr=data.schedule.slice().sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")));return `<div class="head"><div><h2>予定・バイト</h2><div class="mini">授業・バイト・遊びをまとめて管理</div></div><button data-action="add-schedule">＋予定</button></div>${arr.length?arr.map(scheduleItem).join(""):empty("予定を追加してみよう")}`}
function scheduleItem(x){return `<div class="item"><div class="item-main"><b>${esc(x.title)}</b><small>${x.date} ${x.start||""}${x.end?"〜"+x.end:""}</small></div><span class="pill">${esc(x.kind)}</span></div>`}
function moneyView(){const mk=currentMonth();let arr=data.money.slice().reverse();if(moneyMonth==="current")arr=arr.filter(x=>x.date.slice(0,7)===mk);const inc=arr.filter(x=>x.type==="収入").reduce((a,x)=>a+x.amount,0),exp=arr.filter(x=>x.type==="支出").reduce((a,x)=>a+x.amount,0);return `<div class="head"><div><h2>お金管理</h2><div class="mini">今月の収支をサクッと確認</div></div><button data-action="add-money">＋記録</button></div><div class="grid"><div class="card"><div class="label">収入</div><div class="value">${yen(inc)}</div></div><div class="card"><div class="label">支出</div><div class="value">${yen(exp)}</div></div></div><div class="filterrow" style="margin-top:12px"><button class="${moneyMonth==="current"?"on":""}" data-money-filter="current">今月</button><button class="${moneyMonth==="all"?"on":""}" data-money-filter="all">すべて</button></div>${arr.length?arr.map(moneyItem).join(""):empty("お金の記録はありません")}`}
function moneyItem(x){return `<div class="item"><div class="item-main"><b>${esc(x.category)} ${x.note?"・"+esc(x.note):""}</b><small>${x.date}</small></div><span class="pill ${x.type==="支出"?"danger":"ok"}">${x.type==="支出"?"−":"＋"}${yen(x.amount)}</span></div>`}
function empty(t){return `<div class="empty">${t}</div>`}
function openModal(type){modalType=type;document.getElementById("modal").classList.add("show");const f=document.getElementById("form");if(type==="task"){document.getElementById("modalTitle").textContent="課題を追加";f.innerHTML='<div class="field"><label>授業名</label><input id="a" placeholder="例：マーケティング論"></div><div class="field"><label>課題名 *</label><input id="b" placeholder="例：レポート提出"></div><div class="field"><label>提出期限 *</label><input id="c" type="date" value="'+localDate()+'"></div>'}else if(type==="schedule"){document.getElementById("modalTitle").textContent="予定を追加";f.innerHTML='<div class="field"><label>予定 *</label><input id="a" placeholder="例：ゼミ・バイト・遊び"></div><div class="field"><label>日付 *</label><input id="b" type="date" value="'+localDate()+'"></div><div class="field"><label>開始</label><input id="c" type="time"></div><div class="field"><label>終了</label><input id="d" type="time"></div><div class="field"><label>種類</label><select id="e"><option>授業</option><option>バイト</option><option>遊び</option><option>用事</option><option>その他</option></select></div>'}else if(type==="money"){document.getElementById("modalTitle").textContent="お金を記録";f.innerHTML='<div class="field"><label>区分</label><select id="a"><option>支出</option><option>収入</option></select></div><div class="field"><label>カテゴリ</label><select id="b"><option>食費</option><option>交通費</option><option>遊び</option><option>趣味</option><option>大学</option><option>固定費</option><option>バイト</option><option>その他</option></select></div><div class="field"><label>金額 *</label><input id="c" type="number" min="1" inputmode="numeric" placeholder="例：1200"></div><div class="field"><label>日付 *</label><input id="d" type="date" value="'+localDate()+'"></div><div class="field"><label>メモ</label><input id="e" placeholder="例：昼ごはん"></div>'}else{document.getElementById("modalTitle").textContent="今月の予算";f.innerHTML='<div class="field"><label>自由に使える予算</label><input id="a" type="number" min="0" inputmode="numeric" value="'+data.budget+'" placeholder="例：50000"></div>'}}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function saveModal(){if(modalType==="task"){const a=v("a"),b=v("b"),c=v("c");if(!b||!c)return toast("課題名と締切を入力してね");data.tasks.push({id:Date.now(),subject:a,name:b,date:c,done:"未完了"})}else if(modalType==="schedule"){const a=v("a"),b=v("b"),c=v("c"),d=v("d"),e=v("e");if(!a||!b)return toast("予定名と日付を入力してね");data.schedule.push({id:Date.now(),title:a,date:b,start:c,end:d,kind:e})}else if(modalType==="money"){const a=v("a"),b=v("b"),c=Number(v("c")),d=v("d"),e=v("e");if(!c||!d)return toast("金額と日付を入力してね");data.money.push({id:Date.now(),type:a,category:b,amount:c,date:d,note:e})}else{const n=Number(v("a"));if(!Number.isFinite(n)||n<0)return toast("0以上の金額を入れてね");data.budget=n}save();closeModal();render();toast("保存しました")}
function v(id){return document.getElementById(id)?.value?.trim()||""}
function toggleTask(id){const x=data.tasks.find(x=>x.id===id);if(!x)return;x.done=x.done==="完了"?"未完了":"完了";save();render();toast(x.done==="完了"?"課題を完了にしました":"未完了に戻しました")}
document.addEventListener("click",e=>{if(e.target.closest("#profileBtn")){openProfile();return}const nav=e.target.closest("#nav button[data-tab]");if(nav){tab=nav.dataset.tab;render();return}const task=e.target.closest("[data-task-id]");if(task){toggleTask(Number(task.dataset.taskId));return}const sw=e.target.closest("[data-color]");if(sw){data.profile.accent=sw.dataset.color;save();applyProfile();render();return}const filter=e.target.closest("[data-filter]");if(filter){taskFilter=filter.dataset.filter;render();return}const mf=e.target.closest("[data-money-filter]");if(mf){moneyMonth=mf.dataset.moneyFilter;render();return}const action=e.target.closest("[data-action]");if(action){const a=action.dataset.action;if(a==="tasks"){tab="tasks";render()}else if(a.startsWith("add-")){openModal(a.replace("add-",""))}else if(a==="budget")openModal("budget");else if(a==="avatar")chooseImage("avatar");else if(a==="favorite-image")chooseImage("favorite");else if(a==="remove-favorite-image"){data.profile.favoriteImage="";save();render();toast("お気に入り画像を削除しました")}else if(a==="bg-image")chooseImage("bg");else if(a==="remove-bg"){data.profile.bgImage="";save();applyProfile();render();toast("背景画像を削除しました")}else if(a==="save-profile")saveProfile();else if(a==="reset-profile")resetProfile();else if(a==="back-home"){tab="home";render()}return}if(e.target.closest("#fab")){openModal(tab==="tasks"?"task":tab==="schedule"?"schedule":"money");return}if(e.target.closest("#cancelBtn")){closeModal();return}if(e.target.closest("#saveBtn")){saveModal();return}if(e.target.id==="modal")closeModal()});
document.addEventListener("input",e=>{if(e.target.id==="p-accent"){document.documentElement.style.setProperty("--p",e.target.value);const h=document.getElementById("colorHex");if(h)h.textContent=e.target.value}});
window.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
render();
if("serviceWorker" in navigator && location.protocol!=="file:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
