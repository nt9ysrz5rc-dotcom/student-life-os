<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d5dfb"><title>大学生生活OS</title><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="生活OS">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f9;color:#202532;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding-bottom:80px}
header{padding:28px 20px 20px;background:linear-gradient(135deg,#6d5dfb,#8c7df8);color:#fff;border-radius:0 0 28px 28px}h1{margin:0;font-size:25px}.sub{font-size:13px;opacity:.85;margin-top:5px}main{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#f7f7fb;border-radius:18px;padding:15px}.label{font-size:12px;color:#697386}.value{font-size:21px;font-weight:800;margin-top:5px}.section{margin-top:24px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h2{font-size:17px;margin:0}button{touch-action:manipulation;cursor:pointer;border:0;border-radius:12px;padding:9px 13px;background:#6d5dfb;color:white;font-weight:700}.item{padding:13px 0;border-bottom:1px solid #eceef3;display:flex;justify-content:space-between;gap:10px}.item small{color:#747b8a}.pill{padding:4px 8px;border-radius:99px;background:#eeeaff;color:#5b4bd6;font-size:11px;white-space:nowrap}.empty{color:#8a91a0;font-size:13px;padding:12px 0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:white;border-top:1px solid #e9eaf0;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:5}nav button{background:transparent;color:#7a8190;padding:6px 2px;font-size:11px}nav button.active{color:#6d5dfb}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:10;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:24px 24px 0 0;padding:20px}input,select{width:100%;padding:13px;border:1px solid #dddfe7;border-radius:12px;margin:7px 0 13px;font-size:16px}.actions{display:flex;gap:8px}.actions button{flex:1}.cancel{background:#eceef3;color:#444}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;display:none;z-index:20;font-size:13px}
</style></head><body><div class="app"><header><h1>大学生生活OS</h1><div class="sub">大学生活を、ちょっとラクに。</div></header><main id="screen"></main>
<nav id="nav"><button type="button" class="active" data-tab="home">⌂<br>ホーム</button><button type="button" data-tab="tasks">✓<br>課題</button><button type="button" data-tab="schedule">◷<br>予定</button><button type="button" data-tab="money">￥<br>お金</button></nav></div>
<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">追加</h2><div id="form"></div><div class="actions"><button type="button" class="cancel" id="cancelBtn">キャンセル</button><button type="button" id="saveBtn">追加する</button></div></div></div><div class="toast" id="toast"></div>
<script>
if("serviceWorker" in navigator && location.protocol !== "file:"){navigator.serviceWorker.register("./sw.js").catch(()=>{});}
const KEY="student_os_v1";let data=JSON.parse(localStorage.getItem(KEY)||'{"tasks":[],"schedule":[],"money":[]}'),tab="home",modalType="";
const yen=n=>new Intl.NumberFormat("ja-JP").format(n)+"円",today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1500)}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));let income=data.money.filter(x=>x.type==="収入").reduce((a,x)=>a+x.amount,0),expense=data.money.filter(x=>x.type==="支出").reduce((a,x)=>a+x.amount,0),h="";
if(tab==="home")h='<div class="grid"><div class="card"><div class="label">収入</div><div class="value">'+yen(income)+'</div></div><div class="card"><div class="label">支出</div><div class="value">'+yen(expense)+'</div></div><div class="card"><div class="label">今月の収支</div><div class="value">'+yen(income-expense)+'</div></div><div class="card"><div class="label">未完了の課題</div><div class="value">'+data.tasks.filter(x=>x.done!=="完了").length+'件</div></div></div><div class="section"><div class="head"><h2>📌 近い締切</h2><button type="button" data-action="tasks">すべて見る</button></div>'+data.tasks.filter(x=>x.done!=="完了").sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(taskItem).join("")+'</div><div class="section"><div class="head"><h2>🗓 今日の予定</h2><button type="button" data-action="add-schedule">＋追加</button></div>'+data.schedule.filter(x=>x.date===today()).map(scheduleItem).join("")+'</div>';
else if(tab==="tasks")h='<div class="head"><h2>課題管理</h2><button type="button" data-action="add-task">＋課題</button></div>'+data.tasks.sort((a,b)=>a.date.localeCompare(b.date)).map(taskItem).join("");
else if(tab==="schedule")h='<div class="head"><h2>予定・バイト</h2><button type="button" data-action="add-schedule">＋予定</button></div>'+data.schedule.sort((a,b)=>a.date.localeCompare(b.date)).map(scheduleItem).join("");
else h='<div class="head"><h2>お金管理</h2><button type="button" data-action="add-money">＋記録</button></div>'+data.money.slice().reverse().map(moneyItem).join("");
document.getElementById("screen").innerHTML=h||'<div class="empty">まだデータがありません。右上の「＋」から追加してみよう。</div>'}
function taskItem(x){return '<div class="item" data-task-id="'+x.id+'"><div><b>'+esc(x.name)+'</b><br><small>'+esc(x.subject||"")+' ・締切 '+x.date+'</small></div><span class="pill">'+x.done+'</span></div>'}function scheduleItem(x){return '<div class="item"><div><b>'+esc(x.title)+'</b><br><small>'+x.date+' '+(x.start||"")+(x.end?"〜"+x.end:"")+'</small></div><span class="pill">'+x.kind+'</span></div>'}function moneyItem(x){return '<div class="item"><div><b>'+esc(x.category)+'</b><br><small>'+x.date+'・'+esc(x.note||"")+'</small></div><span class="pill">'+(x.type==="支出"?"−":"＋")+yen(x.amount)+'</span></div>'}function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

function toggleTask(id){let x=data.tasks.find(x=>x.id===id);x.done=x.done==="完了"?"未完了":"完了";save();render();toast(x.done==="完了"?"課題を完了にしました":"未完了に戻しました")}
function openModal(type){modalType=type;document.getElementById("modal").classList.add("show");let f=document.getElementById("form");if(type==="task"){document.getElementById("modalTitle").textContent="課題を追加";f.innerHTML='授業名<input id="a" placeholder="例：マーケティング論">課題名<input id="b" placeholder="例：レポート提出">提出期限<input id="c" type="date" value="'+today()+'">'}else if(type==="schedule"){document.getElementById("modalTitle").textContent="予定を追加";f.innerHTML='予定<input id="a" placeholder="例：ゼミ・バイト・遊び">日付<input id="b" type="date" value="'+today()+'">開始<input id="c" type="time">終了<input id="d" type="time">種類<select id="e"><option>授業</option><option>バイト</option><option>遊び</option><option>用事</option><option>その他</option></select>'}else{document.getElementById("modalTitle").textContent="お金を記録";f.innerHTML='区分<select id="a"><option>支出</option><option>収入</option></select>カテゴリ<select id="b"><option>食費</option><option>交通費</option><option>遊び</option><option>趣味</option><option>大学</option><option>固定費</option><option>バイト</option><option>その他</option></select>金額<input id="c" type="number" min="0" placeholder="例：1200">日付<input id="d" type="date" value="'+today()+'">メモ<input id="e" placeholder="例：昼ごはん">'}}
function closeModal(){document.getElementById("modal").classList.remove("show")}function saveModal(){if(modalType==="task"){let a=document.getElementById("a").value,b=document.getElementById("b").value,c=document.getElementById("c").value;if(!b||!c)return toast("課題名と締切を入力してね");data.tasks.push({id:Date.now(),subject:a,name:b,date:c,done:"未完了"})}else if(modalType==="schedule"){let a=document.getElementById("a").value,b=document.getElementById("b").value,c=document.getElementById("c").value,d=document.getElementById("d").value,e=document.getElementById("e").value;if(!a||!b)return toast("予定名と日付を入力してね");data.schedule.push({id:Date.now(),title:a,date:b,start:c,end:d,kind:e})}else{let a=document.getElementById("a").value,b=document.getElementById("b").value,c=Number(document.getElementById("c").value),d=document.getElementById("d").value,e=document.getElementById("e").value;if(!c||!d)return toast("金額と日付を入力してね");data.money.push({id:Date.now(),type:a,category:b,amount:c,date:d,note:e})}save();closeModal();render();toast("追加しました")}
document.addEventListener("click",function(e){
 const nav=e.target.closest("#nav button[data-tab]");
 if(nav){e.preventDefault();tab=nav.dataset.tab;render();return;}
 const task=e.target.closest("[data-task-id]");
 if(task){e.preventDefault();toggleTask(Number(task.dataset.taskId));return;}
 const action=e.target.closest("[data-action]");
 if(action){e.preventDefault();const act=action.dataset.action;if(act==="tasks"){tab="tasks";render()}else if(act==="add-task")openModal("task");else if(act==="add-schedule")openModal("schedule");else if(act==="add-money")openModal("money");return;}
 if(e.target.closest("#cancelBtn")){e.preventDefault();closeModal();return;}
 if(e.target.closest("#saveBtn")){e.preventDefault();saveModal();return;}
 if(e.target.id==="modal")closeModal();
});
render();
</script></body></html>
